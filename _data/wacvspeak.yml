  bio: Maja Rudolph is a Research Professor at the Data Science Institute, University of Wisconsin-Madison, specializing in probabilistic machine learning and generative AI. Previously, she was a Machine Learning Researcher at the Bosch Center for AI, where she advanced the fields of anomaly detection and hybrid modeling. Maja earned her Ph.D. in Computer Science from Columbia University under the mentorship of David Blei and holds a B.S. in Mathematics from MIT.

