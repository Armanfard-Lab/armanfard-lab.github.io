- date: March 2026
headline: We introduced a multitask learning framework that enhances TabPFN by injecting multitask awareness directly into its prior—enabling it to capture complex relationships among mechanical properties in steel manufacturing. See <a href="https://arxiv.org/abs/2603.22738"> here </a> for details.

- date: March 2026
  headline: Our foundation model, ICLAD, is now available <a href="https://arxiv.org/abs/2603.19497"> here </a> -- a tabular anomaly detection model that leverages in-context learning to generalize across datasets and supervision regimes, achieving state-of-the-art performance without task-specific retraining.
  
- date: Feb 2026
  headline: We are proud to announce that two of our team members have completed their theses with exceptional grades and are candidates for the McGill Thesis Award. Khanh defended her PhD on graph-based time-series data, and Jack completed his MSc on in-context Bayesian inference for tabular data.

- date: Nov 2025
  headline: Delighted to announce that our paper, <a href="https://arxiv.org/abs/2511.09970">MultiTab</a>, has been accepted to the top-tier CORE A* conference AAAI 2026! We introduce MultiTab-Net, the first multitask transformer for large tabular datasets, together with MultiTab-Bench for deep, systematic multitask evaluation. Huge congratulations to Dimitri and the whole team!

- date: Sept 2025
  headline: Thrilled to announce that the iSMART Lab has been invited to run a one-day workshop on Anomaly Detection at the prestigious CORE A* AI conference, AAAI 2026, in Singapore. We warmly invite researchers, industry professionals, and stakeholders to participate, submit their original studies, and reach out if they are interested in being included as speakers. More details can be found <a href="https://ismart.ece.mcgill.ca/astad3/">here</a>.

- date: Aug 2025
  headline: Congratulations to Zihan for successfully completing his MSc thesis on Zero Shot Anomaly Detection with prompt learning. Great job, Zihan! 

- date: July 2025
  headline: Our recent study on Zero-Shot Anomaly Detection with Prompt Learning (<a href="https://arxiv.org/abs/2508.00777">PILOT</a>) has been accepted at the prestigious Rank A AI conference, British Machine Vision Conference (BMVC 2025). Congrats to Zihan and the entire iSMART team. 

- date: July 2025
  headline: Our research work on Language-Guided Reinforcement Learning for Attention in Few-Shot (<a href="https://arxiv.org/abs/2310.07800">LaHa</a>) has been accepted at the prestigious Rank A AI conference, British Machine Vision Conference (BMVC) 2025, to be held in Sheffield. Kudos to Bahar and the whole team for this outstanding contribution! 

- date: May 2025
  headline:  <a href="https://arxiv.org/abs/2308.12563"> TSAD‑C </a> — a pioneering framework for handling label‑level noise in sensory time‑series anomaly detection—has been accepted for publication at the prestigious Rank A AI conference, Uncertainty in Artificial Intelligence conference (UAI 2025), one of the premier venues in AI research. The work introduces a practical method that remains robust even when the training data itself is contaminated with anomalies. Congratulations to the iSMART team!
 
- date: April 2025
  headline: Our in-depth study, <a href="https://arxiv.org/abs/2302.00058"><i>Graph-based Time Series Anomaly Detection</i></a>, has been accepted for publication in IEEE Transactions on Pattern Analysis and Machine Intelligence (TPAMI) — one of the most prestigious venues in machine learning. This comprehensive, textbook-style work provides a definitive treatment of graph-based approaches to time series anomaly detection. Congratulations to Khanh and the entire team!

